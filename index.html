<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eduminity — Empowering Students Through Shared Knowledge</title>
    <meta name="description" content="Bangladesh's premier digital platform for students to upload, sell, and review study materials and notes." />
    <meta name="author" content="Eduminity" />

    <!-- App Icons & PWA / Mobile App Settings -->
    <link rel="icon" href="/eduminity-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/eduminity-logo.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eduminity" />

    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eduminity.vercel.app/" />
    <meta property="og:title" content="Eduminity — Learn. Connect. Share." />
    <meta property="og:description" content="Bangladesh's student-powered study notes & academic marketplace. Buy, sell, and share quality university and college notes." />
    <meta property="og:image" content="https://eduminity.vercel.app/eduminity-hero.jpg" />

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eduminity — Learn. Connect. Share." />
    <meta name="twitter:description" content="Bangladesh's student-powered study notes & academic marketplace." />
    <meta name="twitter:image" content="https://eduminity.vercel.app/eduminity-hero.jpg" />

    <!-- Core Fonts Only (Fast Mobile & PWA Load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

    <!-- Auto-recover if an installed PWA hits a stale Vercel chunk after a deploy -->
    <script>
      window.addEventListener("vite:preloadError", function () {
        if (!sessionStorage.getItem("eduminity_chunk_reload")) {
          sessionStorage.setItem("eduminity_chunk_reload", "1");
          window.location.reload();
        }
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
